automation:
  schedule_times: ["05:00"]
  timezone: "America/Los_Angeles"
  videos_per_batch: 5

youtube:
  privacy: "private"
  publish_hour: 20
  publish_minute: 0
  publish_days_ahead: 1
  title_suffix: " #shorts"
  category_id: "24"
  default_tags: ["shorts", "reddit", "story"]

video:
  whisper_model: "large-v3"
  kokoro_voice: "am_onyx"
  video_speed_multiplier: 1.8
  audio_enhancement_level: "extreme"
  use_nvenc: false

database:
  min_score_threshold: 200
  min_word_count: 150
